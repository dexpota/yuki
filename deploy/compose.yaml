name: yuki

x-backend-build: &backend-build
  context: ..
  dockerfile: backend/Dockerfile

services:
  proxy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    ports:
      - "${YUKI_HTTP_BIND_ADDRESS:-127.0.0.1}:${YUKI_HTTP_PORT:-8080}:8080"
    networks:
      - edge
      - application
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: volume
        source: proxy_data
        target: /data
      - type: volume
        source: proxy_config
        target: /config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official image marks the Caddy binary with this file capability.
    # Keep it in the bounding set even though development HTTP uses port 8080.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

  postgres:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${YUKI_POSTGRES_DB:-yuki}
      POSTGRES_USER: ${YUKI_POSTGRES_USER:-yuki}
      POSTGRES_PASSWORD: ${YUKI_POSTGRES_PASSWORD:-yuki-development-only}
    networks:
      - data
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb

  migrate:
    image: yuki-backend:development
    build: *backend-build
    command: ["pnpm", "migrate"]
    restart: "no"
    environment:
      YUKI_DATABASE_URL: postgresql://${YUKI_POSTGRES_USER:-yuki}:${YUKI_POSTGRES_PASSWORD:-yuki-development-only}@postgres:5432/${YUKI_POSTGRES_DB:-yuki}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: yuki-backend:development
    build: *backend-build
    command: ["pnpm", "start:api"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      YUKI_DATABASE_URL: postgresql://${YUKI_POSTGRES_USER:-yuki}:${YUKI_POSTGRES_PASSWORD:-yuki-development-only}@postgres:5432/${YUKI_POSTGRES_DB:-yuki}
      YUKI_CSRF_KEY: ${YUKI_CSRF_KEY:-CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws=}
      YUKI_MASTER_KEY: ${YUKI_MASTER_KEY:-FhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhY=}
      YUKI_ALLOWED_ORIGINS: ${YUKI_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      YUKI_STORAGE_ROOT: /data/yuki
      YUKI_MAXIMUM_UPLOAD_BYTES: ${YUKI_MAXIMUM_UPLOAD_BYTES:-2147483648}
      YUKI_UPLOAD_PROGRESS_INTERVAL_BYTES: ${YUKI_UPLOAD_PROGRESS_INTERVAL_BYTES:-1048576}
    networks:
      - application
      - data
    volumes:
      - type: volume
        source: storage_data
        target: /data/yuki
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  worker:
    image: yuki-backend:development
    build: *backend-build
    command: ["pnpm", "start:worker"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      YUKI_DATABASE_URL: postgresql://${YUKI_POSTGRES_USER:-yuki}:${YUKI_POSTGRES_PASSWORD:-yuki-development-only}@postgres:5432/${YUKI_POSTGRES_DB:-yuki}
      YUKI_STORAGE_ROOT: /data/yuki
      YUKI_MAXIMUM_UPLOAD_BYTES: ${YUKI_MAXIMUM_UPLOAD_BYTES:-2147483648}
      YUKI_UPLOAD_PROGRESS_INTERVAL_BYTES: ${YUKI_UPLOAD_PROGRESS_INTERVAL_BYTES:-1048576}
      YUKI_IMPORT_POLL_INTERVAL_MS: ${YUKI_IMPORT_POLL_INTERVAL_MS:-1000}
      YUKI_IMPORT_JOB_LEASE_MS: ${YUKI_IMPORT_JOB_LEASE_MS:-30000}
    networks:
      - data
    volumes:
      - type: volume
        source: storage_data
        target: /data/yuki
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  web:
    image: yuki-frontend:development
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    restart: unless-stopped
    networks:
      - application
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  edge:
  application:
    internal: true
  data:
    internal: true

volumes:
  postgres_data:
  storage_data:
  proxy_data:
  proxy_config:
