name: yuki

x-backend-build: &backend-build
  context: ..
  dockerfile: backend/Dockerfile

services:
  proxy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    ports:
      - "${YUKI_HTTP_BIND_ADDRESS:-127.0.0.1}:${YUKI_HTTP_PORT:-8080}:8080"
    networks:
      - edge
      - application
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: volume
        source: proxy_data
        target: /data
      - type: volume
        source: proxy_config
        target: /config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official image marks the Caddy binary with this file capability.
    # Keep it in the bounding set even though development HTTP uses port 8080.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

  postgres:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${YUKI_POSTGRES_DB:-yuki}
      POSTGRES_USER: ${YUKI_POSTGRES_USER:-yuki}
      POSTGRES_PASSWORD: ${YUKI_POSTGRES_PASSWORD:-yuki-development-only}
    networks:
      - data
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb

  migrate:
    image: yuki-backend:development
    build: *backend-build
    command: ["node", "dist/platform/database/migrate-main.js", "up"]
    restart: "no"
    environment:
      YUKI_DATABASE_URL: postgresql://${YUKI_POSTGRES_USER:-yuki}:${YUKI_POSTGRES_PASSWORD:-yuki-development-only}@postgres:5432/${YUKI_POSTGRES_DB:-yuki}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

  api:
    image: yuki-backend:development
    build: *backend-build
    command: ["node", "dist/api-main.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      YUKI_DATABASE_URL: postgresql://${YUKI_POSTGRES_USER:-yuki}:${YUKI_POSTGRES_PASSWORD:-yuki-development-only}@postgres:5432/${YUKI_POSTGRES_DB:-yuki}
      YUKI_CSRF_KEY: ${YUKI_CSRF_KEY:-CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws=}
      YUKI_MASTER_KEY: ${YUKI_MASTER_KEY:-FhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhY=}
      YUKI_ALLOWED_ORIGINS: ${YUKI_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      YUKI_STORAGE_ROOT: /data/yuki
      YUKI_STORAGE_BACKEND: ${YUKI_STORAGE_BACKEND:-local}
      YUKI_S3_ENDPOINT: ${YUKI_S3_ENDPOINT:-http://minio:9000}
      YUKI_S3_REGION: ${YUKI_S3_REGION:-us-east-1}
      YUKI_S3_BUCKET: ${YUKI_S3_BUCKET:-yuki}
      YUKI_S3_ACCESS_KEY_ID: ${YUKI_S3_ACCESS_KEY_ID:-yuki-minio}
      YUKI_S3_SECRET_ACCESS_KEY: ${YUKI_S3_SECRET_ACCESS_KEY:-yuki-development-minio-secret}
      YUKI_S3_FORCE_PATH_STYLE: ${YUKI_S3_FORCE_PATH_STYLE:-true}
      YUKI_S3_MULTIPART_THRESHOLD_BYTES: ${YUKI_S3_MULTIPART_THRESHOLD_BYTES:-8388608}
      YUKI_S3_SIGNED_DOWNLOAD_TTL_SECONDS: ${YUKI_S3_SIGNED_DOWNLOAD_TTL_SECONDS:-300}
      YUKI_MAXIMUM_UPLOAD_BYTES: ${YUKI_MAXIMUM_UPLOAD_BYTES:-2147483648}
      YUKI_UPLOAD_PROGRESS_INTERVAL_BYTES: ${YUKI_UPLOAD_PROGRESS_INTERVAL_BYTES:-1048576}
    networks:
      - application
      - data
    volumes:
      - type: volume
        source: storage_data
        target: /data/yuki
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  processor-bridge:
    image: node:24.18.0-alpine3.23
    user: "65532:65532"
    command: ["node", "/bridge/processor-tcp-bridge.mjs"]
    restart: unless-stopped
    environment:
      YUKI_PROCESSOR_BRIDGE_PORT: ${YUKI_PROCESSOR_PORT:-3210}
      YUKI_PROCESSOR_TARGET_HOST: host.docker.internal
      YUKI_PROCESSOR_TARGET_PORT: ${YUKI_PROCESSOR_PORT:-3210}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - data
      - edge
    volumes:
      - type: bind
        source: ./processor-tcp-bridge.mjs
        target: /bridge/processor-tcp-bridge.mjs
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').createConnection(process.env.YUKI_PROCESSOR_BRIDGE_PORT,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777

  worker:
    image: yuki-backend:development
    build: *backend-build
    command: ["node", "dist/worker-main.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      YUKI_DATABASE_URL: postgresql://${YUKI_POSTGRES_USER:-yuki}:${YUKI_POSTGRES_PASSWORD:-yuki-development-only}@postgres:5432/${YUKI_POSTGRES_DB:-yuki}
      YUKI_MASTER_KEY: ${YUKI_MASTER_KEY:-FhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhY=}
      YUKI_STORAGE_ROOT: /data/yuki
      YUKI_STORAGE_BACKEND: ${YUKI_STORAGE_BACKEND:-local}
      YUKI_S3_ENDPOINT: ${YUKI_S3_ENDPOINT:-http://minio:9000}
      YUKI_S3_REGION: ${YUKI_S3_REGION:-us-east-1}
      YUKI_S3_BUCKET: ${YUKI_S3_BUCKET:-yuki}
      YUKI_S3_ACCESS_KEY_ID: ${YUKI_S3_ACCESS_KEY_ID:-yuki-minio}
      YUKI_S3_SECRET_ACCESS_KEY: ${YUKI_S3_SECRET_ACCESS_KEY:-yuki-development-minio-secret}
      YUKI_S3_FORCE_PATH_STYLE: ${YUKI_S3_FORCE_PATH_STYLE:-true}
      YUKI_S3_MULTIPART_THRESHOLD_BYTES: ${YUKI_S3_MULTIPART_THRESHOLD_BYTES:-8388608}
      YUKI_S3_SIGNED_DOWNLOAD_TTL_SECONDS: ${YUKI_S3_SIGNED_DOWNLOAD_TTL_SECONDS:-300}
      YUKI_MAXIMUM_UPLOAD_BYTES: ${YUKI_MAXIMUM_UPLOAD_BYTES:-2147483648}
      YUKI_UPLOAD_PROGRESS_INTERVAL_BYTES: ${YUKI_UPLOAD_PROGRESS_INTERVAL_BYTES:-1048576}
      YUKI_IMPORT_POLL_INTERVAL_MS: ${YUKI_IMPORT_POLL_INTERVAL_MS:-1000}
      YUKI_IMPORT_JOB_LEASE_MS: ${YUKI_IMPORT_JOB_LEASE_MS:-30000}
      YUKI_PROCESSOR_HOST: processor-bridge
      YUKI_PROCESSOR_PORT: ${YUKI_PROCESSOR_PORT:-3210}
      YUKI_PROCESSOR_TOKEN: ${YUKI_PROCESSOR_TOKEN:-ZGV2ZWxvcG1lbnQtb25seS1wcm9jZXNzb3ItdG9rZW4=}
      YUKI_PROCESSOR_RESPONSE_ROOT: /tmp/yuki-processor-responses
    networks:
      - data
    volumes:
      - type: volume
        source: storage_data
        target: /data/yuki
    depends_on:
      migrate:
        condition: service_completed_successfully
      processor-bridge:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  web:
    image: yuki-frontend:development
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    command:
      [
        "node",
        "node_modules/vite/bin/vite.js",
        "--configLoader",
        "runner",
        "--host",
        "0.0.0.0",
        "--port",
        "5173",
      ]
    restart: unless-stopped
    networks:
      - application
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /workspace/frontend/node_modules/.vite:size=64m,uid=1000,gid=1000,mode=0755

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    command: ["server", "/data"]
    restart: unless-stopped
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${YUKI_S3_ACCESS_KEY_ID:-yuki-minio}
      MINIO_ROOT_PASSWORD: ${YUKI_S3_SECRET_ACCESS_KEY:-yuki-development-minio-secret}
    networks:
      - data
    volumes:
      - type: volume
        source: minio_data
        target: /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["s3"]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set yuki http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "yuki/$$MINIO_BUCKET"
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${YUKI_S3_ACCESS_KEY_ID:-yuki-minio}
      MINIO_ROOT_PASSWORD: ${YUKI_S3_SECRET_ACCESS_KEY:-yuki-development-minio-secret}
      MINIO_BUCKET: ${YUKI_S3_BUCKET:-yuki}
    networks:
      - data
    depends_on:
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777

networks:
  edge:
  application:
    internal: true
  data:
    internal: true

volumes:
  postgres_data:
  storage_data:
  proxy_data:
  proxy_config:
  minio_data:
