name: Release production images

on:
  push:
    branches: [develop]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.identity.outputs.created }}
      publish: ${{ steps.identity.outputs.publish }}
      revision: ${{ steps.identity.outputs.revision }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Validate identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          created=$(git show --no-patch --format=%cI HEAD)
          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag must be exact MAJOR.MINOR.PATCH SemVer." >&2
              exit 1
            fi
            tag_revision=$(git rev-parse "${RELEASE_TAG}^{commit}")
            test "$revision" = "$tag_revision"
            version=$RELEASE_TAG
            publish=true
            tag=$RELEASE_TAG
          else
            version=0.0.0
            publish=false
            tag=0.0.0
          fi
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke ${{ matrix.platform }} images
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Build production images
        env:
          CREATED: ${{ needs.validate.outputs.created }}
          PLATFORM: ${{ matrix.platform }}
          REVISION: ${{ needs.validate.outputs.revision }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for role in backend frontend processor; do
            docker build \
              --file "$role/Dockerfile" \
              --platform "$PLATFORM" \
              --target production \
              --build-arg "VERSION=$VERSION" \
              --build-arg "REVISION=$REVISION" \
              --build-arg "CREATED=$CREATED" \
              --tag "yuki-${role}:release-smoke" \
              .
          done
          docker build \
            --file backend/Dockerfile \
            --platform "$PLATFORM" \
            --target supervisor \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            --build-arg "CREATED=$CREATED" \
            --tag yuki-supervisor:release-smoke \
            .
      - name: Smoke production images
        env:
          YUKI_EXPECTED_REVISION: ${{ needs.validate.outputs.revision }}
          YUKI_EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ./deploy/smoke-release-image.sh backend yuki-backend:release-smoke
          ./deploy/smoke-release-image.sh web yuki-frontend:release-smoke
          ./deploy/smoke-release-image.sh processor yuki-processor:release-smoke
          ./deploy/smoke-release-image.sh supervisor yuki-supervisor:release-smoke
          node deploy/smoke-compose-supervisor.mjs \
            yuki-supervisor:release-smoke \
            yuki-backend:release-smoke \
            yuki-processor:release-smoke

  publish-preflight:
    name: Refuse existing release tags
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/dexpota/yuki-backend
      PROCESSOR_IMAGE: ghcr.io/dexpota/yuki-processor
      SUPERVISOR_IMAGE: ghcr.io/dexpota/yuki-supervisor
      WEB_IMAGE: ghcr.io/dexpota/yuki-web
    steps:
      - name: Sign in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1
      - name: Refuse mutable release tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for image in "$BACKEND_IMAGE" "$WEB_IMAGE" "$PROCESSOR_IMAGE" "$SUPERVISOR_IMAGE"; do
            if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              echo "$image:$VERSION already exists; exact release tags are immutable." >&2
              exit 1
            fi
          done

  publish-platform:
    name: Publish native ${{ matrix.arch }} image digests
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, smoke, publish-preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/dexpota/yuki-backend
      PROCESSOR_IMAGE: ghcr.io/dexpota/yuki-processor
      SUPERVISOR_IMAGE: ghcr.io/dexpota/yuki-supervisor
      WEB_IMAGE: ghcr.io/dexpota/yuki-web
    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Sign in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1
      - name: Publish backend image
        id: backend
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: backend/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ needs.validate.outputs.revision }}
            CREATED=${{ needs.validate.outputs.created }}
          cache-from: type=gha,scope=backend-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-release-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Publish web image
        id: web
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: frontend/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.WEB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ needs.validate.outputs.revision }}
            CREATED=${{ needs.validate.outputs.created }}
          cache-from: type=gha,scope=web-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-release-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Publish processor image
        id: processor
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: processor/Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.PROCESSOR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ needs.validate.outputs.revision }}
            CREATED=${{ needs.validate.outputs.created }}
          cache-from: type=gha,scope=processor-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=processor-release-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Publish supervisor image
        id: supervisor
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: backend/Dockerfile
          target: supervisor
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.SUPERVISOR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ needs.validate.outputs.revision }}
            CREATED=${{ needs.validate.outputs.created }}
          cache-from: type=gha,scope=supervisor-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=supervisor-release-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Record native image digests
        env:
          ARCH: ${{ matrix.arch }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          PROCESSOR_DIGEST: ${{ steps.processor.outputs.digest }}
          SUPERVISOR_DIGEST: ${{ steps.supervisor.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p native-digests
          for role in BACKEND WEB PROCESSOR SUPERVISOR; do
            digest_variable="${role}_DIGEST"
            digest="${!digest_variable}"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Invalid $role digest from native $ARCH build." >&2
              exit 1
            fi
            printf '%s\n' "$digest" > "native-digests/${role,,}"
          done
      - name: Upload native image digests
        uses: actions/upload-artifact@v4.6.2
        with:
          name: native-digests-${{ matrix.arch }}
          path: native-digests/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Assemble exact release images
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, publish-platform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/dexpota/yuki-backend
      PROCESSOR_IMAGE: ghcr.io/dexpota/yuki-processor
      SUPERVISOR_IMAGE: ghcr.io/dexpota/yuki-supervisor
      WEB_IMAGE: ghcr.io/dexpota/yuki-web
    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Download native image digests
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: native-digests-*
          path: native-digests
      - name: Sign in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1
      - name: Assemble multi-platform release tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for role in BACKEND WEB PROCESSOR SUPERVISOR; do
            image_variable="${role}_IMAGE"
            image="${!image_variable}"
            digest_amd64=$(<"native-digests/native-digests-amd64/${role,,}")
            digest_arm64=$(<"native-digests/native-digests-arm64/${role,,}")
            for digest in "$digest_amd64" "$digest_arm64"; do
              if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "Invalid native digest for $role." >&2
                exit 1
              fi
            done
            docker buildx imagetools create \
              --tag "$image:$VERSION" \
              --metadata-file "${role,,}-metadata.json" \
              "$image@$digest_amd64" "$image@$digest_arm64"
            index_digest=$(jq -er '."containerimage.descriptor".digest | select(test("^sha256:[a-f0-9]{64}$"))' "${role,,}-metadata.json")
            echo "YUKI_${role}_REFERENCE=$image@$index_digest" >> "$GITHUB_ENV"
          done
      - name: Record index and platform digests
        env:
          YUKI_BACKEND_INDEX_FILE: backend-index.json
          YUKI_BACKEND_TAG: ${{ env.BACKEND_IMAGE }}:${{ needs.validate.outputs.version }}
          YUKI_PROCESSOR_INDEX_FILE: processor-index.json
          YUKI_PROCESSOR_TAG: ${{ env.PROCESSOR_IMAGE }}:${{ needs.validate.outputs.version }}
          YUKI_SUPERVISOR_INDEX_FILE: supervisor-index.json
          YUKI_SUPERVISOR_TAG: ${{ env.SUPERVISOR_IMAGE }}:${{ needs.validate.outputs.version }}
          YUKI_RELEASE_CREATED_AT: ${{ github.event.release.published_at }}
          YUKI_RELEASE_IMAGES_OUTPUT: release-images.json
          YUKI_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          YUKI_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          YUKI_SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          YUKI_SOURCE_REVISION: ${{ needs.validate.outputs.revision }}
          YUKI_WEB_INDEX_FILE: web-index.json
          YUKI_WEB_TAG: ${{ env.WEB_IMAGE }}:${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$YUKI_BACKEND_REFERENCE" --raw > "$YUKI_BACKEND_INDEX_FILE"
          docker buildx imagetools inspect "$YUKI_WEB_REFERENCE" --raw > "$YUKI_WEB_INDEX_FILE"
          docker buildx imagetools inspect "$YUKI_PROCESSOR_REFERENCE" --raw > "$YUKI_PROCESSOR_INDEX_FILE"
          docker buildx imagetools inspect "$YUKI_SUPERVISOR_REFERENCE" --raw > "$YUKI_SUPERVISOR_INDEX_FILE"
          node deploy/generate-release-images.mjs
      - name: Package production deployment files
        run: |
          tar --create --gzip --file yuki-deployment-v2.tar.gz \
            deploy/production/compose.yaml \
            deploy/.env.production.example \
            deploy/select-release.mjs \
            deploy/PRODUCTION.md \
            deploy/backup.sh \
            deploy/restore.sh \
            docs/FULL-BACKUP-FORMAT.md \
            docs/ADR-0008-compose-managed-processor-supervisor.md
      - name: Retain release deployment artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-images-${{ needs.validate.outputs.version }}
          path: |
            release-images.json
            yuki-deployment-v2.tar.gz
          if-no-files-found: error
          retention-days: 90

  attach-release-manifest:
    name: Attach deployment artifacts to release
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release deployment artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          name: release-images-${{ needs.validate.outputs.version }}
      - name: Attach deployment artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-images.json yuki-deployment-v2.tar.gz --repo "$GITHUB_REPOSITORY"
